<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockWorld 2020 - Revival</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">🧱 BlockWorld 2020</div>
        <nav>
            <a href="index.html" class="active">Games</a>
            <a href="catalog.html">Catalog</a>
            <a href="#" id="robux-display">R$ 100</a>
        </nav>
        <div class="auth-nav">
            <span id="user-greeting">Guest</span>
            <a href="login.html" id="login-btn" class="btn">Login</a>
            <button id="logout-btn" class="btn secondary" style="display:none;">Logout</button>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Welcome to BlockWorld 2020 Revival</h1>
            <p>Relive the classic 2020 building & multiplayer era!</p>
        </section>

        <section class="games-section">
            <h2>Featured Games</h2>
            <div class="game-grid" id="game-grid">
                <div class="game-card">
                    <div class="game-thumb">🏗️</div>
                    <h3>Classic Sandbox 2020</h3>
                    <p>Build, explore, and chat with friends in real-time 3D multiplayer.</p>
                    <a href="game.html" class="btn play-btn">Play Now</a>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
