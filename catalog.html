<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog - BlockWorld 2020</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">🧱 BlockWorld 2020</div>
        <nav>
            <a href="index.html">Games</a>
            <a href="catalog.html" class="active">Catalog</a>
            <a href="#" id="robux-display">R$ 100</a>
        </nav>
        <div class="auth-nav">
            <span id="user-greeting">Guest</span>
            <a href="login.html" id="login-btn" class="btn">Login</a>
            <button id="logout-btn" class="btn secondary" style="display:none;">Logout</button>
        </div>
    </header>

    <main class="container">
        <h2>Avatar Shop & Catalog</h2>
        <div class="game-grid">
            <div class="game-card">
                <div class="game-thumb">🧢</div>
                <h3>Classic Roblox Cap</h3>
                <p>R$ 15</p>
                <button class="btn">Buy Item</button>
            </div>
            <div class="game-card">
                <div class="game-thumb">🕶️</div>
                <h3>Builder Shades</h3>
                <p>R$ 25</p>
                <button class="btn">Buy Item</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
